{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="card-title mb-0">Create Your Investment Plan</h3>
                </div>
                <div class="card-body">
                    {% if error %}
                    <div class="alert alert-danger">{{ error }}</div>
                    {% endif %}

                    <form method="POST" action="{{ url_for('portfolio_bp.process_optimization') }}">
                        <div class="mb-3">
                            <label for="capital" class="form-label">Investment Capital (RM)</label>
                            <input type="number" class="form-control" id="capital" name="capital" min="10000" step="10000"
                                required>
                            <div class="form-text">Minimum investment: RM 10,000</div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label">Investment Strategy</label>
                            <div class="card">
                                <div class="card-body">
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="radio" name="strategy" id="conservative"
                                            value="conservative" required>
                                        <label class="form-check-label" for="conservative">
                                            <strong>Conservative</strong> - Lower risk, stable returns
                                        </label>
                                    </div>
                                    <div class="form-check mb-2">
                                        <input class="form-check-input" type="radio" name="strategy" id="balanced"
                                            value="balanced">
                                        <label class="form-check-label" for="balanced">
                                            <strong>Balanced</strong> - Moderate risk/return balance
                                        </label>
                                    </div>
                                    <div class="form-check">
                                        <input class="form-check-input" type="radio" name="strategy" id="aggressive"
                                            value="aggressive">
                                        <label class="form-check-label" for="aggressive">
                                            <strong>Aggressive</strong> - Higher risk, potential for higher returns
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="d-grid">
                            <button type="submit" class="btn btn-primary btn-lg">
                                Generate Portfolio
                            </button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
